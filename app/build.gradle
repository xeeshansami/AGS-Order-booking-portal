apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

// Load signing credentials from a gitignored keystore.properties at the repo
// root (falls back to gradle properties / environment variables). Keeps secrets
// out of version control.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def signingProp = { String key ->
    keystoreProps.getProperty(key) ?: project.findProperty(key) ?: System.getenv(key)
}

android {
    // AGP 8 requires the namespace here instead of the manifest "package" attr.
    namespace "com.agsadil.agssalesandroidclientorderdocter"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.agsadil.agssalesandroidclientorderdocter"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 38
        versionName "16.0.3"
        multiDexEnabled true
        // AGP 8 does not expose VERSION_NAME in BuildConfig here; define it
        // explicitly so existing BuildConfig.VERSION_NAME references compile.
        // Keep this value in sync with versionName above.
        buildConfigField "String", "VERSION_NAME", "\"16.0.3\""
    }

    // BuildConfig is OFF by default in AGP 8; the app uses BuildConfig.DEBUG.
    buildFeatures {
        buildConfig true
    }

    // Release signing. Credentials are read from gradle.properties (which must
    // NOT be committed) or from environment variables, so secrets stay out of
    // version control. See RELEASE_GUIDE.md for the property names to set.
    signingConfigs {
        release {
            def storeFilePath = signingProp("AGS_STORE_FILE")
            if (storeFilePath) {
                // Path is resolved relative to the repo root (e.g. keystore/agsadil.jks)
                storeFile rootProject.file(storeFilePath)
                storePassword(signingProp("AGS_STORE_PASSWORD"))
                keyAlias(signingProp("AGS_KEY_ALIAS"))
                keyPassword(signingProp("AGS_KEY_PASSWORD"))
            }
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    useLibrary 'org.apache.http.legacy'
    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Apply the signing config only when credentials have been provided,
            // otherwise the build still works for unsigned/Android Studio signing.
            if (signingProp("AGS_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support.constraint:constraint-layout:1.0.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    testImplementation 'junit:junit:4.12'
    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:23.4.0'
    //noinspection GradleCompatible
    implementation 'com.android.support:design:23.4.0'
    //noinspection GradleCompatible
    implementation 'com.android.support:cardview-v7:23.4.0'
    implementation 'me.neavo:volley:2014.12.09'
    implementation('com.stripe:stripe-android:8.1.0') {
        exclude group: 'com.android.support'
    }
    implementation "androidx.activity:activity:1.7.2"
    implementation "androidx.fragment:fragment:1.6.2"
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation(project(path: ':mkLoaderView')) {
        exclude group: 'com.android.support', module: 'appcompat-v7'
    }

    // Firebase
    implementation 'com.google.firebase:firebase-messaging:20.1.3'
    implementation 'com.google.firebase:firebase-database:19.2.1'
    implementation 'com.google.firebase:firebase-core:17.2.3'
    implementation 'com.google.firebase:firebase-storage:19.1.1'
    implementation 'com.google.firebase:firebase-auth:19.3.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.10.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.10.0'

    // PDF + multidex
    implementation 'com.itextpdf:itextg:5.5.10'
    implementation 'com.android.support:multidex:1.0.3'

    // Networking (Retrofit / OkHttp)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-simplexml:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.squareup.retrofit2:converter-scalars:2.9.0"
    implementation 'com.squareup.okhttp3:logging-interceptor:4.2.1'
}
repositories {
    mavenCentral()
}
